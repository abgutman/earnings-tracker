name: EDGAR Poll — Recent Earnings

# Schedule: reconciliation sweep — primary detection is edgar-firehose.yml
# 3x/weekday at offset minutes to avoid GitHub's high-load :00/:15/:30/:45 slots.

on:
  workflow_dispatch:  # also runs on manual trigger
  schedule:
    - cron: '23 13,18,21 * * 1-5'   # reconciliation sweep — primary detection is edgar-firehose.yml

concurrency:
  group: earnings-write   # shared: serialize all writers of cache/log/recent_earnings.html to avoid rebase conflicts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run EDGAR poll
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python simple_earnings.py edgar-poll --live
          python simple_dashboard.py

      - name: Commit + push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Auto: EDGAR poll $(date -u +'%Y-%m-%d %H:%M UTC')"
          ok=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            if git rebase --autostash origin/main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          if [ "$ok" != "1" ]; then echo "push failed after 5 attempts" >&2; exit 1; fi
